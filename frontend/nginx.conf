server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router usa rutas del lado del cliente: cualquier ruta que no sea un
    # fichero existente devuelve index.html para que la aplicación la resuelva.
    # Sin esto, recargar en /shop/register da un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend llama a /api, y nginx lo reenvía al backend. Así el bundle no
    # lleva incrustada ninguna URL de entorno.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El límite de intentos del backend es por IP: sin esta cabecera todas
        # las peticiones llegarían con la del contenedor de nginx y el límite
        # sería global.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
